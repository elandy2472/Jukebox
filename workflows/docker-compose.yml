version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_container
    ports:
      - "3000:3000"  # Ajusta según el puerto de tu backend
    volumes:
      - ./src:/app/src  # Sincroniza el código local con el contenedor
    environment:
      DB_HOST: localhost
      DB_PORT: 3000
      DB_USER: root
      DB_PASSWORD: 
      DB_NAME: jukebox
    depends_on:
      - db
      
  db:
    image: mysql:5.2.1
    container_name: DB
    environment:
      MYSQL_ROOT_PASSWORD: 
      MYSQL_DATABASE: jukebox.sql
      MYSQL_USER: user
      MYSQL_PASSWORD: 
    ports:
      - "3000:3000"
    volumes:
      - db_data:/var/lib/mysql

environment:
  - YOUTUBE_API_KEY=AIzaSyAzS5LK_3koqYQk8rsVpJRdiPWDNRTLIio
  - YOUTUBE_API_BASE_URL=https://www.googleapis.com/youtube/v3
  

volumes:
  db_data:
